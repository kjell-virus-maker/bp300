<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Debug Player</title>

<style>
body {
    background: #121212;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 95%;
    max-width: 800px;
    background: #1e1e1e;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin-bottom: 15px;
}

button {
    padding: 10px 20px;
    background: #ff0000;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
}

#status {
    margin-top: 15px;
    font-weight: bold;
}

#progressContainer {
    width: 100%;
    background: #333;
    border-radius: 10px;
    margin-top: 10px;
    display: none;
}

#progressBar {
    height: 8px;
    width: 0%;
    background: #ff0000;
    border-radius: 10px;
    transition: width 0.3s ease;
}

#error {
    color: #ff4d4d;
    margin-top: 10px;
}

#player {
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">
    <h2>YouTube Player Debug</h2>

    <input id="ytLink" placeholder="YouTube Link einfügen...">
    <button onclick="loadVideo()">Video laden</button>

    <div id="status"></div>

    <div id="progressContainer">
        <div id="progressBar"></div>
    </div>

    <div id="error"></div>

    <div id="player"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player;
let progressInterval;

function extractVideoId(url) {
    const regex = /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/;
    const match = url.match(regex);
    return match ? match[1] : null;
}

function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
        height: '400',
        width: '100%',
        videoId: '',
        events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange,
            'onError': onPlayerError
        }
    });
}

function loadVideo() {
    const input = document.getElementById("ytLink").value.trim();
    const videoId = extractVideoId(input);

    document.getElementById("error").textContent = "";
    document.getElementById("status").textContent = "🔄 Lade Video...";
    document.getElementById("progressContainer").style.display = "block";
    document.getElementById("progressBar").style.width = "20%";

    if (!videoId) {
        showError("Ungültiger YouTube Link.");
        return;
    }

    player.loadVideoById(videoId);
}

function onPlayerReady() {
    console.log("Player ready");
}

function onPlayerStateChange(event) {
    const status = document.getElementById("status");

    if (event.data === YT.PlayerState.PLAYING) {
        status.textContent = "▶️ Video läuft";
        document.getElementById("progressBar").style.width = "100%";
        clearInterval(progressInterval);
    }

    if (event.data === YT.PlayerState.BUFFERING) {
        status.textContent = "⏳ Buffering...";
        simulateLoading();
    }

    if (event.data === YT.PlayerState.ENDED) {
        status.textContent = "✅ Video beendet";
    }
}

function onPlayerError(event) {
    let message = "";

    switch (event.data) {
        case 2:
            message = "❌ Ungültige Video-ID.";
            break;
        case 5:
            message = "❌ HTML5 Player Fehler.";
            break;
        case 100:
            message = "❌ Video nicht gefunden oder privat.";
            break;
        case 101:
        case 150:
            message = "❌ Einbetten vom Video nicht erlaubt.";
            break;
        default:
            message = "❌ Unbekannter Fehler.";
    }

    showError(message);
}

function showError(msg) {
    document.getElementById("error").textContent = msg;
    document.getElementById("status").textContent = "⚠ Fehler";
    document.getElementById("progressContainer").style.display = "none";
}

function simulateLoading() {
    let width = 20;
    progressInterval = setInterval(() => {
        if (width >= 90) return;
        width += 5;
        document.getElementById("progressBar").style.width = width + "%";
    }, 200);
}

</script>

</body>
</html>
