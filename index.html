<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Inline Player</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #121212;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 95%;
    max-width: 800px;
    background: #1e1e1e;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 20px rgba(255,0,0,0.3);
    text-align: center;
}

h1 {
    margin-bottom: 20px;
    color: #ff0000;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin-bottom: 15px;
    font-size: 16px;
}

button {
    padding: 10px 20px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.primary {
    background: #ff0000;
    color: white;
}

.primary:hover {
    background: #cc0000;
}

.error {
    color: #ff4d4d;
    margin-bottom: 10px;
}

#player {
    margin-top: 20px;
    border-radius: 12px;
    overflow: hidden;
}

</style>
</head>

<body>

<div class="container">
    <h1>YouTube Video Player</h1>

    <input 
        type="text" 
        id="ytLink" 
        placeholder="YouTube Link einfügen..."
        autofocus
    >

    <div id="errorMsg" class="error"></div>

    <button class="primary" onclick="loadVideo()">Video laden & abspielen</button>

    <div id="player"></div>
</div>

<!-- YouTube Iframe API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player;

function extractVideoId(url) {
    const regex = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
    const match = url.match(regex);
    return match ? match[1] : null;
}

// Wird automatisch von YouTube API aufgerufen
function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
        height: '400',
        width: '100%',
        videoId: '',
        playerVars: {
            'autoplay': 1,
            'controls': 1,
            'rel': 0
        }
    });
}

function loadVideo() {
    const input = document.getElementById("ytLink").value.trim();
    const errorMsg = document.getElementById("errorMsg");

    errorMsg.textContent = "";

    const videoId = extractVideoId(input);

    if (!videoId) {
        errorMsg.textContent = "Bitte gültigen YouTube-Link eingeben.";
        return;
    }

    if (player && player.loadVideoById) {
        player.loadVideoById(videoId);
    }
}

// Enter-Taste Support
document.getElementById("ytLink").addEventListener("keypress", function(e){
    if (e.key === "Enter") {
        loadVideo();
    }
});

</script>

</body>
</html>
