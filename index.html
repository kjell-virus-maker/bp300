<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>YouTube Test</title>
</head>
<body style="background:#111; color:white; font-family:Arial; text-align:center;">

<h2>YouTube Test Player</h2>

<input id="ytLink" style="width:300px; padding:8px;" placeholder="YouTube Link einfügen">
<button onclick="loadVideo()">Video laden</button>

<p id="debug"></p>

<div id="playerContainer"></div>

<script>

function loadVideo() {

    const input = document.getElementById("ytLink").value;
    document.getElementById("debug").innerText = "Eingegebener Link: " + input;

    // Wir nehmen ALLES nach v=
    let videoId = null;

    if (input.includes("v=")) {
        videoId = input.split("v=")[1].substring(0,11);
    } 
    else if (input.includes("youtu.be/")) {
        videoId = input.split("youtu.be/")[1].substring(0,11);
    }

    if (!videoId) {
        document.getElementById("debug").innerText = "Video ID nicht erkannt!";
        return;
    }

    document.getElementById("debug").innerText = "Video ID erkannt: " + videoId;

    const iframe = document.createElement("iframe");
    iframe.width = "560";
    iframe.height = "315";
    iframe.src = "https://www.youtube.com/embed/" + videoId;
    iframe.allowFullscreen = true;

    document.getElementById("playerContainer").innerHTML = "";
    document.getElementById("playerContainer").appendChild(iframe);
}

</script>

</body>
</html>
