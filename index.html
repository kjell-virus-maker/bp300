<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Player Stable</title>

<style>
body {
    background:#121212;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container {
    width:95%;
    max-width:800px;
    background:#1e1e1e;
    padding:30px;
    border-radius:12px;
    text-align:center;
}

input {
    width:100%;
    padding:12px;
    border-radius:8px;
    border:none;
    margin-bottom:15px;
}

button {
    padding:10px 20px;
    background:#ff0000;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
}

#status { margin-top:10px; }
#error { color:#ff4d4d; margin-top:10px; }

#progressContainer {
    width:100%;
    background:#333;
    border-radius:10px;
    margin-top:10px;
    display:none;
}

#progressBar {
    height:8px;
    width:0%;
    background:#ff0000;
    border-radius:10px;
    transition:width .3s;
}

iframe {
    margin-top:20px;
    width:100%;
    height:400px;
    border-radius:12px;
}
</style>
</head>

<body>

<div class="container">
    <h2>YouTube Player</h2>

    <input id="ytLink" placeholder="YouTube Link einfügen...">
    <button onclick="loadVideo()">Video laden</button>

    <div id="status"></div>

    <div id="progressContainer">
        <div id="progressBar"></div>
    </div>

    <div id="error"></div>
    <div id="playerContainer"></div>
</div>

<script>

function extractVideoId(url) {
    const regex = /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/;
    const match = url.match(regex);
    return match ? match[1] : null;
}

function loadVideo() {

    const input = document.getElementById("ytLink").value.trim();
    const videoId = extractVideoId(input);

    const status = document.getElementById("status");
    const error = document.getElementById("error");
    const progress = document.getElementById("progressContainer");
    const bar = document.getElementById("progressBar");
    const container = document.getElementById("playerContainer");

    error.textContent = "";
    container.innerHTML = "";

    if (!videoId) {
        error.textContent = "Ungültiger YouTube Link.";
        return;
    }

    status.textContent = "🔄 Lade Video...";
    progress.style.display = "block";
    bar.style.width = "50%";

    const iframe = document.createElement("iframe");
    iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
    iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
    iframe.allowFullscreen = true;

    iframe.onload = function() {
        status.textContent = "▶️ Video geladen";
        bar.style.width = "100%";
    };

    container.appendChild(iframe);
}

</script>

</body>
</html>
