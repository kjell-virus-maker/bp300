<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Player Stable</title>

<style>
body {
    background:#121212;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container {
    width:95%;
    max-width:800px;
    background:#1e1e1e;
    padding:30px;
    border-radius:12px;
    text-align:center;
}

input {
    width:100%;
    padding:12px;
    border-radius:8px;
    border:none;
    margin-bottom:15px;
}

button {
    padding:10px 20px;
    background:#ff0000;
    border:none;
    border-radius:8px;
    color:white;
    cursor:pointer;
}

#status { margin-top:10px; }
#error { color:#ff4d4d; margin-top:10px; }

#progressContainer {
    width:100%;
    background:#333;
    border-radius:10px;
    margin-top:10px;
    display:none;
}

#progressBar {
    height:8px;
    width:0%;
    background:#ff0000;
    border-radius:10px;
    transition:width .3s;
}

#player { margin-top:20px; }
</style>
</head>

<body>

<div class="container">
    <h2>YouTube Player</h2>
    <input id="ytLink" placeholder="YouTube Link einfügen...">
    <button onclick="loadVideo()">Video laden</button>

    <div id="status"></div>

    <div id="progressContainer">
        <div id="progressBar"></div>
    </div>

    <div id="error"></div>
    <div id="player"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player = null;
let playerReady = false;

function extractVideoId(url) {
    const regex = /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/;
    const match = url.match(regex);
    return match ? match[1] : null;
}

function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
        height: '400',
        width: '100%',
        videoId: '',
        events: {
            'onReady': function () {
                playerReady = true;
                console.log("Player ready");
            },
            'onStateChange': onPlayerStateChange,
            'onError': onPlayerError
        }
    });
}

function loadVideo() {
    const input = document.getElementById("ytLink").value.trim();
    const videoId = extractVideoId(input);

    document.getElementById("error").textContent = "";
    document.getElementById("status").textContent = "🔄 Lade Video...";
    document.getElementById("progressContainer").style.display = "block";
    document.getElementById("progressBar").style.width = "30%";

    if (!videoId) {
        showError("Ungültiger Link.");
        return;
    }

    if (!playerReady) {
        showError("YouTube API noch nicht bereit. Seite neu laden.");
        return;
    }

    player.loadVideoById(videoId);
}

function onPlayerStateChange(event) {

    if (event.data === YT.PlayerState.BUFFERING) {
        document.getElementById("status").textContent = "⏳ Buffering...";
        document.getElementById("progressBar").style.width = "60%";
    }

    if (event.data === YT.PlayerState.PLAYING) {
        document.getElementById("status").textContent = "▶️ Video läuft";
        document.getElementById("progressBar").style.width = "100%";
    }
}

function onPlayerError(event) {
    showError("Fehlercode: " + event.data);
}

function showError(msg) {
    document.getElementById("error").textContent = msg;
    document.getElementById("status").textContent = "⚠ Fehler";
    document.getElementById("progressContainer").style.display = "none";
}

</script>

</body>
</html>
